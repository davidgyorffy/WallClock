name: Update gamma radiation

on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

concurrency:
  group: wallclock-gamma-update
  cancel-in-progress: false

jobs:
  update-gamma:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Fetch Budapest II. ker. THHE radiation value
        run: python scripts/update_gamma.py

      - name: Commit and push gamma.json safely
        shell: bash
        run: |
          set -e
          git config user.name "wallclock-gamma-bot"
          git config user.email "wallclock-gamma-bot@users.noreply.github.com"
          git add gamma.json

          if git diff --cached --quiet; then
            echo "No gamma data change."
            exit 0
          fi

          git commit -m "Update gamma radiation data"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed. Retrying from latest main..."
              sleep 5
              continue
            fi

            if git push origin HEAD:main; then
              echo "gamma.json pushed successfully."
              exit 0
            fi

            echo "Remote changed again before push. Retrying..."
            sleep 5
          done

          echo "Failed to push gamma.json after 3 attempts."
          exit 1
