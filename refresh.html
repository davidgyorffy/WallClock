<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>WallClock v84 teljes frissítés</title>
<style>
body{background:#000;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:40px 20px}
h1{font-size:28px}p{font-size:18px;line-height:1.5}
button{font-size:20px;padding:14px 20px;margin-top:20px}
</style>
</head>
<body>
<h1>WallClock v84 teljes frissítés</h1>
<p id="status">Régi Service Workerek és gyorsítótárak eltávolítása…</p>
<button id="go" style="display:none">V81 MEGNYITÁSA</button>
<script>
(function(){
  var status=document.getElementById("status");
  var go=document.getElementById("go");

  function clearCaches(){
    if (!("caches" in window)) return Promise.resolve([]);
    return caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){ return caches.delete(k); }));
    });
  }

  function clearWorkers(){
    if (!("serviceWorker" in navigator)) return Promise.resolve([]);
    return navigator.serviceWorker.getRegistrations().then(function(regs){
      return Promise.all(regs.map(function(r){ return r.unregister(); }));
    });
  }

  Promise.all([clearCaches(), clearWorkers()]).then(function(){
    status.textContent="Kész. A régi cache és Service Worker törölve.";
    go.style.display="inline-block";
  }).catch(function(err){
    status.textContent="A tisztítás részben sikertelen, de megpróbálhatod megnyitni a v84-et.";
    go.style.display="inline-block";
  });

  go.onclick=function(){
    var nonce=Date.now();
    location.replace("./index.html?v=84&refresh="+nonce);
  };
})();
</script>
</body>
</html>
